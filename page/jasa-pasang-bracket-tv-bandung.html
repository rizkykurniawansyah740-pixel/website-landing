                                {APP_CONFIG.faqs.map((faq, i) => (
                                    <motion.div key={i} initial={{ opacity: 0, y: 10 }} whileInView={{ opacity: 1, y: 0 }} className="bg-slate-800/50 border border-slate-700/50 p-8 rounded-[2rem] hover:border-blue-500/30 transition-all">
                                        <h4 className="text-xl font-black mb-4 flex items-center gap-4 uppercase">
                                            <span className="flex-shrink-0 w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-sm font-black">Q</span>
                                            {faq.q}
                                        </h4>
                                        <p className="text-slate-400 leading-relaxed md:pl-12 text-sm md:text-base">
                                            {faq.a}
                                        </p>
                                    </motion.div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Gallery */}
                    <section id="galeri" className="py-32 bg-slate-50/50">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="flex items-center justify-between mb-20">
                                <h2 className="text-4xl font-black text-slate-900 tracking-tighter uppercase">Galeri</h2>
                                <div className="w-20 h-1 bg-blue-600 rounded-full" />
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                {APP_CONFIG.gallery.map((img, i) => (
                                    <motion.div key={i} whileHover={{ y: -10 }} className="aspect-[4/5] rounded-[2rem] overflow-hidden relative group">
                                        <img src={img.src} alt={img.alt} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-slate-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-all flex items-end p-8">
                                            <span className="text-white font-black text-xs uppercase tracking-widest">{img.alt}</span>
                                        </div>
                                    </motion.div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="pt-32 pb-16 bg-white border-t border-slate-100">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="grid md:grid-cols-4 gap-20 mb-24">
                                <div className="md:col-span-2">
                                    <div className="flex items-center gap-3 mb-8">
                                        <div className="bg-blue-600 p-2.5 rounded-xl text-white">
                                            <Icon name="tv" className="w-5 h-5" />
                                        </div>
                                        <span className="text-2xl font-black tracking-tighter uppercase">YOGIES</span>
                                    </div>
                                    <p className="text-slate-500 text-lg max-w-sm mb-10 leading-relaxed">Pelopor jasa pemasangan bracket TV di Bandung yang mengutamakan kualitas visual dan keamanan struktural.</p>
                                    <div className="flex items-center gap-8 text-slate-400">
                                        <a href={WHATSAPP_LINK} className="hover:text-blue-600 transition-colors"><Icon name="phone" className="w-6 h-6" /></a>
                                        <a href={WHATSAPP_LINK} className="hover:text-blue-600 transition-colors"><Icon name="message-circle" className="w-6 h-6" /></a>
                                        <a href={WHATSAPP_LINK} className="hover:text-blue-600 transition-colors tracking-widest font-black text-[10px] uppercase">Instagram</a>
                                    </div>
                                </div>
                                <div>
                                    <h4 className="text-xs font-black uppercase tracking-widest text-slate-400 mb-8">Area Layanan</h4>
                                    <ul className="space-y-4 font-bold text-slate-600">
                                        <li className="flex items-center gap-3"><Icon name="map-pin" className="w-4 h-4 text-blue-600" /> Bandung Kota</li>
                                        <li className="flex items-center gap-3"><Icon name="map-pin" className="w-4 h-4 text-blue-600" /> Cimahi</li>
                                        <li className="flex items-center gap-3"><Icon name="map-pin" className="w-4 h-4 text-blue-600" /> Bandung Timur</li>
                                        <li className="flex items-center gap-3"><Icon name="map-pin" className="w-4 h-4 text-blue-600" /> Bandung Selatan</li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="text-xs font-black uppercase tracking-widest text-slate-400 mb-8">Bantuan</h4>
                                    <ul className="space-y-4 font-bold text-slate-600 text-sm">
                                        <li><a href="#" className="hover:text-blue-600 transition-colors">• Cara Order</a></li>
                                        <li><a href="#" className="hover:text-blue-600 transition-colors">• Cek Harga</a></li>
                                        <li><a href="#" className="hover:text-blue-600 transition-colors">• Katalog Produk</a></li>
                                        <li className="flex items-center gap-3 pt-4"><Icon name="clock" className="w-4 h-4 text-blue-600" /> 08:00 - 20:00</li>
                                    </ul>
                                </div>
                            </div>
                            <div className="flex flex-col md:flex-row justify-between items-center gap-6 pt-12 border-t border-slate-50 text-center md:text-left">
                                <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">© 2024 YOGIES TECH. Terpercaya Sejak 2018.</p>
                                <div className="flex gap-10">
                                    <a href="#" className="text-xs font-bold text-slate-400 hover:text-slate-900 uppercase tracking-widest">Privacy</a>
                                    <a href="#" className="text-xs font-bold text-slate-400 hover:text-slate-900 uppercase tracking-widest">Terms</a>
                                </div>
                            </div>
                        </div>
                    </footer>

                    {/* Floating Button */}
                    <motion.a 
                        whileHover={{ scale: 1.1, y: -5 }} 
                        whileTap={{ scale: 0.9 }}
                        href={WHATSAPP_LINK} 
                        className="fixed bottom-10 right-10 z-[60] bg-white text-blue-600 p-5 rounded-3xl shadow-2xl border border-slate-100 flex items-center group"
                    >
                        <Icon name="message-circle" className="w-8 h-8 fill-current" />
                        <span className="max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-500 font-black uppercase text-xs ml-0 group-hover:ml-3 tracking-widest whitespace-nowrap">Tanya Teknisi</span>
                    </motion.a>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    } catch (e) {
        console.error("App Crash:", e);
        document.getElementById('root').innerHTML = `
            <div style="padding: 40px; font-family: sans-serif; text-align: center;">
                <h1 style="color: #e11d48;">Terjadi Kesalahan</h1>
                <p>Maaf, aplikasi gagal memuat. Detail error:</p>
                <div style="background: #f1f5f9; padding: 20px; border-radius: 12px; display: inline-block; text-align: left; max-width: 80%; overflow: auto;">
                    <pre style="margin: 0;">${e.stack || e.message}</pre>
                </div>
                <p style="margin-top: 20px;"><button onclick="location.reload()" style="padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer;">Muat Ulang</p>
            </div>
        `;
    }
    </script>
</body>
</html>
