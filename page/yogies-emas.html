    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR4OylatcQB2MePUvcte_jbBQrbBITa_Hnm4_3w5boPAvMzwRKSeHo_HGcimCpZfgYOB6T4qH-Ug64z/pub?gid=0&single=true&output=csv";

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} ref={iconRef} className={className} style={{ width: size, height: size, display: 'inline-block' }}></i>;
        };

        const FAQItem = ({ question, answer }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="mb-4 overflow-hidden rounded-3xl border border-neutral-200 bg-white transition-all hover:border-amber-400">
                    <button onClick={() => setIsOpen(!isOpen)} className="flex w-full items-center justify-between p-6 text-left outline-none">
                        <span className="text-lg font-bold text-neutral-800">{question}</span>
                        <div className={`transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`}>
                            <Icon name="chevron-down" className="text-amber-500" />
                        </div>
                    </button>
                    <AnimatePresence>
                        {isOpen && (

                                <div className="px-6 pb-6 text-neutral-600 border-t border-neutral-50 pt-4 text-base leading-relaxed">
                                    {answer}
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        };

        const App = () => {
            const [activePrices, setActivePrices] = useState({
                displayDate: "Memuat harga...",
                rows: []
            });
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [showScrollTop, setShowScrollTop] = useState(false);
            const [syncStatus, setSyncStatus] = useState('idle');

            const syncPricesFromSheet = async () => {
                setSyncStatus('syncing');
                try {
                    const response = await fetch(`${SHEET_CSV_URL}&t=${Date.now()}`);
                    if (!response.ok) throw new Error("Gagal mengambil Google Sheets");
                    const csvText = await response.text();
                    const wb = XLSX.read(csvText, { type: 'string' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(ws);

                    const rows = data.map(row => ({
                        gram: String(
    					row['gram'] ?? row['Gramasi'] ?? ''
						).trim(),
                        antamBasic: String(row['antam_basic'] || row['Antam Basic'] || '-'),
                        antamBuy: String(row['antam_buy'] || row['Antam Buyback'] || '-'),
                        emasBasic: String(row['emas_basic'] || row['Emasku Basic'] || '-'),
                        emasBuy: String(row['emas_buy'] || row['Emasku Buyback'] || '-')
                    })).filter(r => r.gram !== '' && r.gram !== 'undefined');

                    if (rows.length > 0) {
                        setActivePrices({
                            id: 'live-' + Date.now(),
                            displayDate: new Date().toLocaleString('id-ID', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' }) + " (SINKRON LIVE)",
                            rows
                        });
                        setSyncStatus('success');
                    }
                } catch (error) {
                    console.error("Sheet Sync Error:", error);
                    setSyncStatus('error');
                    // Fallback ke data Firestore jika ada
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                const initFirebase = () => {
                    if (window.fb) {
                        const { db, collection, query, orderBy, limit, onSnapshot } = window.fb;
                        const q = query(collection(db, 'prices'), orderBy('id', 'desc'), limit(10));
                        onSnapshot(q, (snapshot) => {
                            const updates = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setHistory(updates);
                            // Jika belum dapat data dari sheet, tampilkan data terbaru database
                            if (updates.length > 0 && loading) {
                                setActivePrices(updates[0]);
                                setLoading(false);
                            }
                        });
                        syncPricesFromSheet();
                    } else {
                        setTimeout(initFirebase, 500);
                    }
                };
                initFirebase();
                const handleScroll = () => setShowScrollTop(window.scrollY > 400);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

                                        {item === 'home' ? 'Beranda' : item === 'prices' ? 'Harga' : item}
                                    </a>
                                ))}
                            </div>

                            <div className="hidden sm:block">
                                <a href="https://wa.me/6283800889643" target="_blank" className="bg-neutral-900 text-white px-6 py-2.5 rounded-full font-bold text-sm hover:scale-105 active:scale-95 transition-all shadow-md">
                                    PESAN WA
                                </a>
                            </div>

                            <button className="lg:hidden p-2 text-neutral-800" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                                <Icon name={isMobileMenuOpen ? "x" : "menu"} size={24}/>
                            </button>
                        </div>
                        
                        {/* Mobile Menu */}
                        <AnimatePresence>
                            {isMobileMenuOpen && (
                                <motion.div initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} exit={{ opacity: 0, height: 0 }} className="lg:hidden bg-white border-t border-neutral-100 overflow-hidden">
                                    <div className="p-6 flex flex-col gap-4">
                                        {['home', 'prices', 'brand', 'features', 'education', 'faq'].map(item => (
                                            <a key={item} href={`#${item}`} onClick={() => setIsMobileMenuOpen(false)} className="text-lg font-bold text-neutral-700 capitalize border-b border-neutral-50 pb-2">
                                                {item}
                                            </a>
                                        ))}
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>

                    {/* Hero Section */}
                    <section id="home" className="relative h-[80vh] flex items-center justify-center text-center px-6 overflow-hidden bg-neutral-900">
                        <div className="absolute inset-0">
                            <img src="https://i.imgur.com/vhqLTJW.jpeg" className="w-full h-full object-cover brightness-[0.4] saturate-50" />
                            <div className="absolute inset-0 hero-mask"></div>

                        <motion.div initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 1 }} className="relative z-10 max-w-4xl">

                                <a href="https://wa.me/6283800889643" target="_blank" className="bg-white/10 hover:bg-white text-white hover:text-neutral-900 border border-white/30 px-10 py-4 rounded-full font-black text-lg backdrop-blur-md transition-all flex items-center justify-center gap-3">KONSULTASI ADMIN <Icon name="message-circle" size={20}/></a>
                            </div>
                        </motion.div>
                    </section>

                    {/* Stats Highlights */}
                    <div className="relative z-10 -mt-16 px-6 mb-20">
                        <div className="mx-auto max-w-7xl grid grid-cols-1 sm:grid-cols-3 gap-6">
                            {[
                                { i: "shield-check", t: "100% ASLI", d: "Emas bersertifikat resmi dari produsen terkemuka." },

                                        <th className="px-3 sm:px-8 py-4 sm:py-8 text-[11px] sm:text-xl font-black border-b border-white/5 whitespace-nowrap min-w-[70px]" rowSpan="2">Gramasi</th>
                                        <th className="px-6 py-4 text-center text-[10px] font-black uppercase tracking-widest border-l border-white/10" colSpan="2">ANTAM</th>

                                    </tr>
