                    const res = await fetch(url);
                    const csv = await res.text();
                    const wb = XLSX.read(csv, { type: 'string' });
                    const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

                    setProducts(prev => prev.map(p => {
                        const match = data.find(d => Number(d.ID || d.id) === p.id);
                        return match ? { ...p, price: Number(match.Price || match.price || match.Harga) || p.price } : p;
                    }));
                    if (isInitial) setToast({ message: "Sistem Harga Aktif & Sinkron", type: 'success' });
                } catch (e) {
                    console.error(e);
                }
            };

            useEffect(() => {
                syncPrices(true);
                const timer = setInterval(() => syncPrices(false), 5000);
                return () => clearInterval(timer);
            }, []);

                    const t = setTimeout(() => setToast(null), 3000);
                    return () => clearTimeout(t);
                }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
